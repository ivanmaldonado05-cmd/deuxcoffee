<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script>try{if(localStorage.getItem('deux-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Deux Coffee Roasters — café de especialidad tostado en Paraguay desde 2017.">
  <title>Deux Coffee Roasters</title>
  <link rel="icon" type="image/webp" href="assets/img/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="landing" data-title-key="title_home">

  <!-- Transición de entrada: pantalla + logo que se desvanece -->
  <div class="intro" id="intro" aria-hidden="true">
    <img class="intro__logo" src="assets/img/logo.webp" alt="">
  </div>

  <!-- Header transparente (solo landing) -->
  <header class="site-header site-header--landing">
    <div class="wrap site-header__bar">
      <nav class="nav" id="nav" aria-label="Principal">
        <ul class="nav__list">
          <li><a class="nav__link" href="home.html" data-i18n="nav_home">Inicio</a></li>
          <li><a class="nav__link" href="quienes-somos.html" data-i18n="nav_about">Quiénes somos</a></li>
          <li><a class="nav__link" href="dine-in.html" data-i18n="nav_dinein">Dine In</a></li>
          <li><a class="nav__link" href="to-go.html" data-i18n="nav_togo">To Go</a></li>
          <li><a class="nav__link" href="menu.html" data-i18n="nav_menu">Menú</a></li>
          <li><a class="nav__link" href="tienda.html" data-i18n="nav_store">Tienda</a></li>
          <li><a class="nav__link" href="contacto.html" data-i18n="nav_contact">Contacto</a></li>
        </ul>
      </nav>
      <div class="header-tools">
        <div class="lang" role="group" aria-label="Idioma / Language">
          <button class="lang__btn" type="button" data-lang="es" aria-pressed="true">ES</button>
          <button class="lang__btn" type="button" data-lang="pt" aria-pressed="false">PT</button>
          <button class="lang__btn" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <button class="nav-toggle" type="button" aria-label="Menú" aria-expanded="false" aria-controls="nav"><span></span></button>
    </div>
  </header>

  <!-- Landing con video de fondo -->
  <main class="landing-main">
    <video class="landing-video" id="landing-video" autoplay muted loop playsinline preload="auto" poster="assets/video/deux-hero-poster.webp">
      <source src="assets/video/deux-hero.mp4" type="video/mp4">
    </video>
    <div class="landing-overlay"></div>

    <a class="landing-logo" id="landing-logo" href="home.html" aria-label="Entrar — Deux Coffee Roasters">
      <img src="assets/img/logo.webp" alt="Deux Coffee Roasters">
    </a>
    <a class="landing-enter" href="home.html" data-i18n="landing_enter">Entrar</a>

    <button class="audio-toggle" id="audio-toggle" type="button" aria-pressed="false" aria-label="Activar sonido del video">
      <svg class="ic-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      <svg class="ic-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <span data-i18n="landing_audio">Sonido</span>
    </button>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      var intro = document.getElementById("intro");
      var v = document.getElementById("landing-video");
      var done = false;
      function hideIntro() {
        if (done || !intro) return; done = true;
        intro.classList.add("is-hidden");
        setTimeout(function () { intro.style.display = "none"; }, 1000);
      }
      window.addEventListener("load", function () { setTimeout(hideIntro, 1100); });
      if (v) {
        v.addEventListener("canplay", function () { setTimeout(hideIntro, 800); });
        var p = v.play(); if (p && p.catch) p.catch(function () {});
      }
      var at = document.getElementById("audio-toggle");
      if (at && v) {
        at.addEventListener("click", function () {
          v.muted = !v.muted;
          var on = !v.muted;
          at.setAttribute("aria-pressed", String(on));
          at.classList.toggle("is-on", on);
          if (on) { var p2 = v.play(); if (p2 && p2.catch) p2.catch(function () {}); }
        });
      }
    })();
  </script>
</body>
</html>
